<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion — Pilotage Prédictif SG</title>
    <link rel="icon" href="/assets/favicon.ico">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
            color: #f2f0e8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            /* Degrade sombre au-dessus de la photo : la photo reste lisible
               mais ne concurrence pas le contraste du formulaire, qui garde
               son propre fond opaque (.login-box) independamment de ce degrade. */
            background:
                linear-gradient(160deg, rgba(15, 14, 11, 0.85) 0%, rgba(28, 26, 22, 0.55) 45%, rgba(15, 14, 11, 0.9) 100%),
                url("/assets/login-bg.jpg") center / cover no-repeat;
        }
        .login-box {
            background: #211f18;
            border: 1px solid #35322a;
            border-radius: 4px;
            padding: 40px;
            width: 340px;
        }
        .brand-mark { display: flex; align-items: center; gap: 9px; margin-bottom: 22px; }
        .brand-mark .bar { width: 4px; height: 20px; background: #e60028; border-radius: 1px; }
        .brand-name { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #a8a396; }
        .login-title { font-size: 17px; font-weight: 600; margin-bottom: 3px; }
        .login-subtitle { font-size: 12.5px; color: #a8a396; margin-bottom: 26px; }
        label { display: block; font-size: 12px; color: #a8a396; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #35322a;
            background: #17150f;
            color: #f2f0e8;
            border-radius: 3px;
            font-size: 14px;
            margin-bottom: 16px;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: #e60028; }
        button {
            width: 100%;
            padding: 11px;
            background: #e60028;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
        }
        button:hover { background: #c40021; }
        .erreur {
            background: rgba(230, 0, 40, 0.12);
            color: #ff5570;
            border: 1px solid rgba(230, 0, 40, 0.3);
            border-radius: 3px;
            padding: 9px 12px;
            font-size: 12.5px;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="brand-mark">
            <div class="bar"></div>
            <div class="brand-name">Société Générale</div>
        </div>
        <div class="login-title">Pilotage Prédictif</div>
        <div class="login-subtitle">Opérations Personnes Physiques</div>
        {% if erreur %}
        <div class="erreur">{{ erreur }}</div>
        {% endif %}
        <form method="POST">
            <label for="username">Identifiant</label>
            <input type="text" id="username" name="username" autofocus required autocomplete="username">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
            <button type="submit">Se connecter</button>
        </form>
    </div>
</body>
</html>
