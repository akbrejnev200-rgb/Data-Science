name: AML — CI

# Le code vit dans 06-MLOps-Vertex-AI/ (sous-dossier du monorepo) ; les
# workflows GitHub Actions doivent être à la racine, mais on ne se déclenche
# que quand ce dossier change — les notebooks du reste du repo n'y touchent pas.
on:
  push:
    branches: [main]
    paths: ["06-MLOps-Vertex-AI/**"]
  pull_request:
    paths: ["06-MLOps-Vertex-AI/**"]

defaults:
  run:
    working-directory: 06-MLOps-Vertex-AI

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer le projet (+ outils de dev)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests unitaires
        run: pytest -q
