name: NeoGarden — CI

# Le code vit dans 04-Generative-AI-Applications/neogarden-assistant/
# (sous-dossier du monorepo) ; le workflow doit etre a la racine, mais on ne
# se declenche que quand ce dossier change.
on:
  push:
    branches: [main]
    paths: ["04-Generative-AI-Applications/neogarden-assistant/**"]
  pull_request:
    paths: ["04-Generative-AI-Applications/neogarden-assistant/**"]

defaults:
  run:
    working-directory: 04-Generative-AI-Applications/neogarden-assistant

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Installer le projet (+ outils de dev)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Tests unitaires (mocks, aucun appel reseau)
        run: pytest -q
